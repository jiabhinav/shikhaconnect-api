services:
  api:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5); exit(0 if json.load(r).get('database_connected') is True else 1)"
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
